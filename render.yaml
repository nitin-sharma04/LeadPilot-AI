services:
  - type: web
    name: leadpilot-web
    runtime: node
    plan: starter
    # Use Node 20 LTS (less memory than Node 24 default on Render)
    envVarGroups: []
    buildCommand: npm ci && NODE_OPTIONS=--max-old-space-size=2048 npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      # Set these in the Render dashboard (Supabase URL, secrets). Do not commit secrets.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: AUTH_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DEMO_MODE
        value: "false"

  - type: web
    name: leadpilot-voice
    runtime: node
    plan: starter
    rootDir: voice-server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
