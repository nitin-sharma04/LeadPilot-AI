services:
  - type: web
    name: leadpilot-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leadpilot-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: AUTH_URL
        sync: false
      # Add remaining secrets in the Render dashboard — never commit values here

  - type: web
    name: leadpilot-voice
    runtime: node
    plan: starter
    rootDir: voice-server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leadpilot-db
          property: connectionString
      - key: PORT
        value: "10000"
      # VOICE_STREAM_URL / GEMINI / TWILIO set in dashboard

databases:
  - name: leadpilot-db
    plan: basic-256mb
    databaseName: leadpilot
    user: leadpilot
