services:
  - type: web
    name: leadpilot-web
    runtime: node
    plan: starter
    buildCommand: npm ci && NODE_OPTIONS=--max-old-space-size=2048 npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      - key: VOICE_MODE
        value: realtime
      - key: DEMO_MODE
        value: "false"
      # Set in Render dashboard (do not commit secrets):
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: AUTH_URL
        sync: false
      - key: VOICE_WEBHOOK_BASE_URL
        sync: false
      # Must be the public WSS of leadpilot-voice, e.g. wss://leadpilot-voice.onrender.com/media-stream
      - key: VOICE_STREAM_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        sync: false
      - key: GEMINI_LIVE_VOICE
        value: Aoede
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: CRON_SECRET
        sync: false

  # Separate realtime media service (Twilio Media Streams ↔ Gemini Live)
  - type: web
    name: leadpilot-voice
    runtime: node
    plan: starter
    # Build from monorepo root so Prisma schema + client resolve correctly
    buildCommand: npm ci && npx prisma generate && npm --prefix voice-server ci
    startCommand: npm --prefix voice-server run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.19.0"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        sync: false
      - key: GEMINI_LIVE_VOICE
        value: Aoede
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: VOICE_MAX_CALL_DURATION_SECONDS
        value: "600"
